<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Lumière</title>
<style>*{box-sizing:border-box;margin:0}body{font-family:'Segoe UI',sans-serif;background:#f4f2ec;color:#111}.top{background:#111;color:#fff;padding:14px 20px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}.top b{font-family:Georgia;font-size:20px;color:#b8923a;margin-right:auto}.top button,.top a{background:none;border:1px solid #555;color:#fff;padding:7px 14px;border-radius:20px;cursor:pointer;font-size:14px;text-decoration:none}.top .on{background:#b8923a;border-color:#b8923a}
main{max-width:1100px;margin:auto;padding:20px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}.k{background:#fff;border-radius:12px;padding:16px}.k small{color:#777}.k h2{margin-top:4px}.bx{background:#fff;border-radius:12px;padding:16px;margin-bottom:16px;overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px;text-align:left;border-bottom:1px solid #eee;white-space:nowrap}
.bars{display:flex;align-items:flex-end;gap:10px;height:160px}.bars div{flex:1;background:#b8923a;border-radius:6px 6px 0 0;position:relative;min-width:30px}.bars span{position:absolute;bottom:-20px;font-size:10px;left:0;right:0;text-align:center}.bars{padding-bottom:24px}
input,select,button.b{padding:8px;border:1px solid #ddd;border-radius:8px;font:inherit}button.b{background:#111;color:#fff;cursor:pointer}.red{background:#c0392b!important}form{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.low{color:#c0392b;font-weight:600}</style></head><body>
<div class="top"><b>LUMIÈRE Admin</b><button data-t="ov" class="on">Overview</button><button data-t="pr">Products</button><button data-t="or">Orders</button><button data-t="cu">Customers</button><button data-t="pm">Promotions</button><a href="../index.html">← Store</a></div>
<main id="m"></main><script src="../js/data.js"></script><script>
/* Admin dashboard: demo only, all data in localStorage */
let P=getProducts(),tab='ov';const m=document.getElementById('m');
const save=()=>LSS('sw_products',P);
function ov(){const o=getOrders(),ok=o.filter(x=>x.status!='Cancelled'),rev=ok.reduce((s,x)=>s+x.total,0),cu=new Set(o.map(x=>x.cust.email)).size,low=P.filter(p=>p.stock<10),pend=o.filter(x=>x.status=='Pending').length;
 const top=[...P].sort((a,b)=>b.sold-a.sold).slice(0,6),mx=top[0].sold,sc=STATUS.map(s=>[s,o.filter(x=>x.status==s).length]);
 return`<div class="cards">${[['Total Revenue',N(rev)],['Orders',o.length],['Customers',cu],['Products',P.length],['Pending Orders',pend],['Low Stock',low.length]].map(k=>`<div class="k"><small>${k[0]}</small><h2>${k[1]}</h2></div>`).join('')}</div>
 <div class="bx"><h3>Top products (units sold)</h3><br><div class="bars">${top.map(p=>`<div style="height:${p.sold/mx*100}%"><span>${p.emoji} ${p.sold}</span></div>`).join('')}</div></div>
 <div class="bx"><h3>Orders by status</h3><br>${sc.map(s=>`<p>${s[0]}: <b>${s[1]}</b></p>`).join('')}</div><div class="bx"><h3>Low-stock products</h3>${low.map(p=>`<p class="low">${p.name} — ${p.stock} left</p>`).join('')||'None'}</div>`}
function pr(){return`<div class="bx"><form onsubmit="addP(event)"><input name="n" required placeholder="Product name"><select name="c">${CATS.map(c=>`<option>${c}</option>`).join('')}</select><input name="p" type="number" required placeholder="Price ₦"><input name="d" type="number" value="0" placeholder="Discount %"><input name="s" type="number" value="10" placeholder="Stock"><button class="b">Add product</button></form>
 <table><tr><th>Product</th><th>Category</th><th>Price</th><th>Disc%</th><th>Stock</th><th></th></tr>${P.map(p=>`<tr><td>${p.emoji} ${p.name}</td><td>${p.cat}</td><td>${N(p.price)}</td><td>${p.disc}</td><td class="${p.stock<10?'low':''}">${p.stock}</td><td><button class="b" onclick="edP(${p.id})">Edit</button> <button class="b red" onclick="delP(${p.id})">Delete</button></td></tr>`).join('')}</table></div>`}
function addP(e){e.preventDefault();const f=new FormData(e.target);P.push({id:Math.max(0,...P.map(p=>p.id))+1,name:f.get('n'),cat:f.get('c'),price:+f.get('p'),disc:+f.get('d'),stock:+f.get('s'),emoji:'🛒',rating:4,sold:0,desc:'New product from Lumière.'});save();show()}
function edP(id){const p=P.find(x=>x.id==id),v=prompt('Price, discount %, stock (comma separated)',[p.price,p.disc,p.stock].join(','));if(!v)return;const[a,b,c]=v.split(',').map(Number);if([a,b,c].some(isNaN))return alert('Invalid values');Object.assign(p,{price:a,disc:b,stock:c});save();show()}
function delP(id){if(confirm('Delete this product?')){P=P.filter(p=>p.id!=id);save();show()}}
function or(){const o=getOrders();return`<div class="bx"><table><tr><th>Ref</th><th>Customer</th><th>Date</th><th>Total</th><th>Status</th></tr>${o.map((x,i)=>`<tr><td>${x.ref}</td><td>${x.cust.name}<br><small>${x.cust.email}</small></td><td>${new Date(x.date).toLocaleDateString('en-NG')}</td><td>${N(x.total)}</td><td><select onchange="stt(${i},this.value)">${STATUS.map(s=>`<option ${s==x.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</table></div>`}
function stt(i,v){const o=getOrders();o[i].status=v;LSS('sw_orders',o)}
function cu(){const mp={};getOrders().forEach(x=>{const c=mp[x.cust.email]=mp[x.cust.email]||{n:x.cust.name,e:x.cust.email,o:0,t:0};c.o++;c.t+=x.total});return`<div class="bx"><table><tr><th>Name</th><th>Email</th><th>Orders</th><th>Total spent</th></tr>${Object.values(mp).map(c=>`<tr><td>${c.n}</td><td>${c.e}</td><td>${c.o}</td><td>${N(c.t)}</td></tr>`).join('')}</table></div>`}
function pm(){const c=getCoupons();return`<div class="bx"><h3>Discount codes</h3><br><form onsubmit="addC(event)"><input name="c" required placeholder="CODE"><input name="p" type="number" min="1" max="90" required placeholder="% off"><button class="b">Create</button></form>${Object.entries(c).map(([k,v])=>`<p><b>${k}</b> — ${v}% off <button class="b red" onclick="delC('${k}')">✕</button></p>`).join('')}</div>
 <div class="bx"><h3>Flash sale</h3><br><form onsubmit="event.preventDefault();flash()"><input id="fp" type="number" min="0" max="90" placeholder="Set discount % on selected category"><select id="fc">${CATS.map(c=>`<option>${c}</option>`).join('')}</select><button class="b">Apply flash sale</button></form></div>`}
function addC(e){e.preventDefault();const f=new FormData(e.target),c=getCoupons();c[f.get('c').toUpperCase()]=+f.get('p');LSS('sw_coupons',c);show()}
function delC(k){const c=getCoupons();delete c[k];LSS('sw_coupons',c);show()}
function flash(){const p=+document.getElementById('fp').value,c=document.getElementById('fc').value;P.forEach(x=>{if(x.cat==c)x.disc=p});save();alert('Flash sale applied to '+c)}
function show(){m.innerHTML={ov,pr,or,cu,pm}[tab]()}
document.querySelectorAll('.top button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('.top button').forEach(x=>x.classList.toggle('on',x==b));show()});show();
</script></body></html>
